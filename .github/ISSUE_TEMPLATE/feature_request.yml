name: Feature request
description: Suggest an idea or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: cost
    attributes:
      label: Cost and data terms
      description: |
        Does it need paid API calls? Would it require caching or storing Google/Foursquare content?
        (Google Places content may not be stored — only place IDs.)
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
